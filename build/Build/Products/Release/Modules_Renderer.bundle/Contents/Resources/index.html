<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1f2328;
      --fg-muted: #59636e;
      --fg-subtle: #818b96;
      --bg: #ffffff;
      --bg-soft: #f6f8fa;
      --bg-softer: #fafbfc;
      --border: #d1d9e0;
      --border-soft: #e4e7eb;
      --accent: #0969da;
      --code-bg: #f6f8fa;
      --code-fg: #24292f;
      --quote-border: #d1d9e0;
      --quote-fg: #59636e;
      --kbd-bg: #f6f8fa;
      --kbd-border: #afb8c1;
      --table-header-bg: #f6f8fa;
      --shadow: rgba(31, 35, 40, 0.04);
      --paper-bg: #ffffff;
      --paper-shadow: rgba(0, 0, 0, 0.18);
      --canvas-bg: #d8dde3;
      --pagebreak-fg: #8a949e;
      --pagebreak-line: #c8ccd2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --fg-muted: #9198a1;
        --fg-subtle: #6e7781;
        --bg: #0d1117;
        --bg-soft: #161b22;
        --bg-softer: #11161d;
        --border: #2f343c;
        --border-soft: #21262d;
        --accent: #4493f8;
        --code-bg: #161b22;
        --code-fg: #e6edf3;
        --quote-border: #3d444d;
        --quote-fg: #9198a1;
        --kbd-bg: #21262d;
        --kbd-border: #444c56;
        --table-header-bg: #161b22;
        --shadow: rgba(0, 0, 0, 0.3);
        --paper-bg: #161b22;
        --paper-shadow: rgba(0, 0, 0, 0.55);
        --canvas-bg: #07090c;
        --pagebreak-fg: #6e7781;
        --pagebreak-line: #2f343c;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--canvas-bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-feature-settings: "kern", "liga", "calt";
    }
    /* "Paper" sheet — A4 dimensions (210mm × 297mm) with print-matching margins. */
    main {
      width: 210mm;
      min-height: 297mm;
      box-sizing: border-box;
      margin: 28px auto;
      padding: 20mm 18mm 22mm 18mm;
      background: var(--paper-bg);
      box-shadow: 0 4px 24px var(--paper-shadow), 0 0 0 1px rgba(0, 0, 0, 0.04);
      border-radius: 2px;
    }
    /* Manual page-break: visible band on screen, real page break in print. */
    main div[style*="page-break"],
    main div[style*="break-after: page"],
    main div[style*="break-before: page"] {
      display: block;
      text-align: center;
      margin: 1.6em -18mm;
      padding: 6px 18mm;
      color: var(--pagebreak-fg);
      font-size: 0.74em;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--bg-softer);
      border-top: 1px dashed var(--pagebreak-line);
      border-bottom: 1px dashed var(--pagebreak-line);
      user-select: none;
    }
    main div[style*="page-break"]::before,
    main div[style*="break-after: page"]::before,
    main div[style*="break-before: page"]::before {
      content: "— page break —";
    }
    main > *:first-child { margin-top: 0; }
    main > *:last-child { margin-bottom: 0; }

    h1, h2, h3, h4, h5, h6 {
      margin: 1.6em 0 0.6em;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.011em;
    }
    h1 { font-size: 1.85em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); letter-spacing: -0.022em; }
    h2 { font-size: 1.4em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); letter-spacing: -0.018em; }
    h3 { font-size: 1.18em; }
    h4 { font-size: 1em; }
    h5 { font-size: 0.9em; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    h6 { font-size: 0.85em; color: var(--fg-subtle); }
    h1:first-child { margin-top: 0; }

    p { margin: 0 0 1em; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s ease; }
    a:hover { border-bottom-color: currentColor; }

    strong { font-weight: 600; }
    em { font-style: italic; }
    del { color: var(--fg-muted); }

    ul, ol { margin: 0 0 1em; padding-left: 1.6em; }
    li + li { margin-top: 0.2em; }
    li > p { margin-bottom: 0.4em; }
    li::marker { color: var(--fg-subtle); }
    li.task-list-item { list-style: none; margin-left: -1.3em; }
    li.task-list-item input[type="checkbox"] {
      margin-right: 0.5em;
      accent-color: var(--accent);
      vertical-align: -0.05em;
    }

    blockquote {
      margin: 1em 0;
      padding: 0.4em 1em;
      color: var(--quote-fg);
      border-left: 3px solid var(--quote-border);
      background: var(--bg-softer);
      border-radius: 0 6px 6px 0;
    }
    blockquote > :last-child { margin-bottom: 0; }

    hr {
      height: 1px;
      border: 0;
      background: var(--border);
      margin: 2.4em 0;
    }

    code, kbd {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.86em;
    }
    :not(pre) > code {
      padding: 0.15em 0.4em;
      background: var(--code-bg);
      border-radius: 4px;
      color: var(--code-fg);
      border: 1px solid var(--border-soft);
    }
    kbd {
      display: inline-block;
      padding: 0.15em 0.5em;
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-bottom-width: 2px;
      border-radius: 4px;
      box-shadow: inset 0 -1px 0 var(--kbd-border);
      font-size: 0.8em;
    }
    pre {
      margin: 1em 0;
      padding: 14px 16px;
      overflow: auto;
      background: var(--code-bg);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      line-height: 1.5;
      box-shadow: 0 1px 0 var(--shadow);
    }
    pre code {
      padding: 0;
      background: transparent;
      border: 0;
      font-size: 0.86em;
      color: var(--code-fg);
    }

    /* Pretty scrollbars */
    pre::-webkit-scrollbar, table::-webkit-scrollbar { height: 8px; width: 8px; }
    pre::-webkit-scrollbar-thumb, table::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    pre::-webkit-scrollbar-track, table::-webkit-scrollbar-track { background: transparent; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 1em 0; border-radius: 8px; border: 1px solid var(--border-soft); }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.92em;
    }
    th, td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      vertical-align: top;
    }
    thead th {
      background: var(--table-header-bg);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.005em;
    }
    tbody tr:hover { background: var(--bg-softer); }
    tbody tr:last-child td { border-bottom: 0; }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    /* Mermaid */
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 1.2em 0;
      padding: 18px;
      background: var(--bg-softer);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
    }
    .mermaid svg { max-width: 100%; height: auto; }

    /* KaTeX */
    .katex-display {
      margin: 1em 0;
      padding: 0.6em 0.8em;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--bg-softer);
      border-radius: 6px;
      font-size: 1.05em;
    }
    .katex { font-size: 1em; }

    /* Subtle in-page heading anchor effect */
    h1, h2, h3, h4, h5, h6 { scroll-margin-top: 16px; }

    /* Print: A4 paper, sensible page-break rules, web-safe colors */
    @page {
      size: A4;
      margin: 20mm 18mm 22mm 18mm;
    }
    @page :first {
      margin-top: 24mm;
    }
    @media print {
      :root { color-scheme: light only; }
      html, body {
        background: #fff !important;
        color: #111 !important;
        font-size: 10.5pt;
        line-height: 1.5;
      }
      main {
        width: auto;
        max-width: none;
        min-height: 0;
        margin: 0;
        padding: 0;
        background: transparent !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      /* Hide the on-screen page-break band; the inline style keeps real page-break behavior. */
      main div[style*="page-break"],
      main div[style*="break-after: page"],
      main div[style*="break-before: page"] {
        all: unset;
        display: block;
        height: 0;
      }
      main div[style*="page-break"]::before,
      main div[style*="break-after: page"]::before,
      main div[style*="break-before: page"]::before { content: none; }
      pre, :not(pre) > code, .mermaid, .katex-display, blockquote {
        background: #f8f8f8 !important;
        color: #111 !important;
        border-color: #d8dce0 !important;
        box-shadow: none !important;
      }
      pre code { color: #111 !important; }
      a { color: #0e58a4 !important; border-bottom: 0 !important; }
      a[href]::after { content: " (" attr(href) ")"; font-size: 0.82em; color: #6a737d; }
      a[href^="#"]::after, a[href=""]::after { content: ""; }
      h1, h2 { border-color: #d8dce0 !important; }
      h1 { font-size: 17pt; }
      h2 { font-size: 13pt; }
      h3 { font-size: 11.5pt; }
      h4, h5, h6 { font-size: 10.5pt; }

      /* Headings stick to following content (no orphan headings at page bottom) */
      h1, h2, h3, h4, h5, h6 {
        break-after: avoid;
        page-break-after: avoid;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Paragraphs: avoid widows / orphans (single dangling lines) */
      p, li {
        orphans: 3;
        widows: 3;
      }

      /* Atomic blocks — never split across pages */
      pre, blockquote, .mermaid, .katex-display, figure, img, .table-wrap {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Tables */
      .table-wrap { overflow: visible; border: 0; }
      table { font-size: 9.5pt; break-inside: avoid; page-break-inside: avoid; }
      thead { display: table-header-group; }
      tfoot { display: table-footer-group; }
      tr, th, td { break-inside: avoid; page-break-inside: avoid; }

      /* Lists shouldn't dangle a single item at top of next page */
      ul, ol { break-inside: auto; }
      li { break-inside: avoid; page-break-inside: avoid; }

      /* Less aggressive top margin for first heading on a page */
      h1 + *, h2 + *, h3 + * { break-before: avoid; page-break-before: avoid; }
    }

    #empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: var(--fg-muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <main id="content"><div id="empty">Empty document.</div></main>

  <script type="application/json" id="source-data">"{{DATA}}"</script>

  <script type="module">
    import { marked } from "https://cdn.jsdelivr.net/npm/marked@14.1.3/+esm";
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.esm.min.mjs";
    import katex from "https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.min.mjs";
    import renderMathInElement from "https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/contrib/auto-render.min.mjs";
    import hljs from "https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/+esm";

    const root = document.getElementById("content");
    const isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

    let payload;
    try {
      payload = JSON.parse(document.getElementById("source-data").textContent);
    } catch (err) {
      payload = { markdown: "" };
    }
    const markdown = (payload && payload.markdown) || "";

    if (!markdown.trim()) {
      // Keep the empty placeholder
    } else {
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? "dark" : "default",
        securityLevel: "loose",
      });

      // Custom renderer: turn ```mermaid blocks into <pre class="mermaid"> for mermaid.run()
      // and apply highlight.js to all other fenced code blocks.
      // marked v14 passes a single token object; older signatures passed (code, infostring).
      const renderer = new marked.Renderer();
      renderer.code = function (codeOrToken, infostring) {
        let raw;
        let lang;
        if (typeof codeOrToken === "object" && codeOrToken !== null) {
          // marked v14 token: { type, raw, lang, text, codeBlockStyle }
          raw = codeOrToken.text ?? "";
          lang = (codeOrToken.lang || "").match(/\S*/)?.[0] || "";
        } else {
          // legacy signature
          raw = String(codeOrToken ?? "");
          lang = (infostring || "").match(/\S*/)?.[0] || "";
        }

        if (lang === "mermaid") {
          return `<pre class="mermaid">${escapeHtml(raw)}</pre>`;
        }
        if (lang && hljs.getLanguage(lang)) {
          try {
            const highlighted = hljs.highlight(raw, { language: lang, ignoreIllegals: true }).value;
            return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
          } catch {
            // fall through
          }
        }
        return `<pre><code class="hljs">${escapeHtml(raw)}</code></pre>`;
      };

      marked.setOptions({
        renderer,
        gfm: true,
        breaks: false,
      });

      const html = marked.parse(markdown);
      root.innerHTML = html;

      // Task lists: GFM-style checkboxes (marked already emits <input type="checkbox">,
      // but we tag the parent <li> for styling).
      root.querySelectorAll('li > input[type="checkbox"]').forEach((cb) => {
        cb.parentElement?.classList.add("task-list-item");
        cb.disabled = true;
      });

      // Wrap tables for horizontal scrolling on narrow widths.
      root.querySelectorAll("table").forEach((tbl) => {
        if (tbl.parentElement?.classList.contains("table-wrap")) return;
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        tbl.parentNode?.insertBefore(wrap, tbl);
        wrap.appendChild(tbl);
      });

      // Render math
      try {
        renderMathInElement(root, {
          throwOnError: false,
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
            { left: "$", right: "$", display: false },
          ],
        });
      } catch (err) {
        console.warn("KaTeX auto-render failed:", err);
      }

      // Render mermaid diagrams
      try {
        await mermaid.run({ querySelector: ".mermaid" });
      } catch (err) {
        console.warn("Mermaid render failed:", err);
      }
    }

    // Tell the host we're ready (so PDF export waits for full render).
    try {
      window.webkit?.messageHandlers?.bridge?.postMessage({ event: "ready" });
    } catch {}

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;",
      })[c]);
    }
  </script>
</body>
</html>
